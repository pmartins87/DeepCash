name: DeepCash R5 VR-MCCFR integration oracle v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_vr_external_sampling.py'
      - 'tests/test_river_vr_external_sampling.py'
      - 'deepcash_core/vr_mccfr_baseline.py'
      - 'tests/test_vr_mccfr_baseline.py'
      - '.github/workflows/r5-vr-mccfr-integration-oracle-v1.yml'

jobs:
  vr-integration-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Gate VR algebra and external-sampling integration
        run: >-
          python -m pytest -q
          tests/test_vr_mccfr_baseline.py
          tests/test_river_vr_external_sampling.py
