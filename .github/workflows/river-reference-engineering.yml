name: DeepCash river reference engineering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_reference_lab.py'
      - 'deepcash_core/river_reference_training.py'
      - 'tools/benchmark_river_reference_convergence.py'
      - 'tools/analyze_river_reference_convergence.py'
      - 'tests/test_river_reference_lab.py'
      - 'tests/test_river_reference_training.py'
      - 'tests/test_reference_convergence_analyzer.py'
      - '.github/workflows/river-reference-engineering.yml'

jobs:
  tighter-common-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and gate reference components
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_river_reference_lab.py \
            tests/test_river_reference_training.py \
            tests/test_reference_convergence_analyzer.py
      - name: Run tighter cumulative reference convergence
        run: >-
          python tools/benchmark_river_reference_convergence.py
          --checkpoints 200,800,2000
          --range-combos 3
          --boards A_high_dry
          --candidates S1_50,S2_33_100,S3_25_75_150
          --out river_reference_convergence_engineering.json
      - name: Analyze interval tightening
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_reference_convergence_engineering.json
          --out river_reference_convergence_engineering_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-reference-engineering
          path: |
            river_reference_convergence_engineering.json
            river_reference_convergence_engineering_analysis.json
