name: DeepCash R5 alternating DCFR development v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_alternating_dcfr.py'
      - 'tools/benchmark_river_alternating_dcfr.py'
      - 'tests/test_river_alternating_dcfr.py'
      - 'docs/R5_ALTERNATING_DCFR_PRECOMMIT_20260816.md'
      - '.github/workflows/r5-alternating-dcfr-dev-v1.yml'

jobs:
  alternating-dcfr-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run exact alternating CFR+ and DCFR battery
        run: >-
          python tools/benchmark_river_alternating_dcfr.py
          --checkpoints 100,400,1200
          --range-combos 6
          --pot 100
          --stack 400
          --p0-phase 0.00
          --p1-phase 0.27
          --out r5_alternating_dcfr_dev_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: r5-alternating-dcfr-dev-v1
          path: r5_alternating_dcfr_dev_v1.json
