name: DeepCash one-raise multi-SPR reference v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_benchmark_fixtures.py'
      - 'deepcash_core/reference_convergence_analysis.py'
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'tools/benchmark_river_raise_reference_convergence.py'
      - 'tools/analyze_river_reference_convergence.py'
      - '.github/workflows/river-raise-reference-multispr-v3.yml'

jobs:
  one-raise-multispr:
    strategy:
      fail-fast: false
      matrix:
        stack: [50, 100, 200, 400]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run one-raise common-reference convergence at target SPR
        run: >-
          python tools/benchmark_river_raise_reference_convergence.py
          --checkpoints 250,1000,3000
          --range-combos 4
          --pot 100
          --stack ${{ matrix.stack }}
          --boards all
          --candidates O1_50,O2_25_75,O3_25_50_100
          --out river_raise_reference_spr_${{ matrix.stack }}.json
      - name: Analyze convergence without post-hoc thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_raise_reference_spr_${{ matrix.stack }}.json
          --out river_raise_reference_spr_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-raise-reference-spr-${{ matrix.stack }}
          path: |
            river_raise_reference_spr_${{ matrix.stack }}.json
            river_raise_reference_spr_${{ matrix.stack }}_analysis.json
