name: DeepCash R6 turn+river exact control v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deepcash_core/turn_river_exact_game.py'
      - 'tests/test_turn_river_exact_game.py'
      - 'docs/R6_TURN_BETTING_EXACT_CONTROL_20260819.md'
      - 'docs/R6_TURN_BETTING_EXACT_CONTROL_PRECOMMIT_20260819.md'
      - '.github/workflows/r6-turn-river-exact-control-v1.yml'

jobs:
  exact-turn-river-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run focused R6 exact-control gate
        run: python -m pytest -q tests/test_turn_river_exact_game.py
