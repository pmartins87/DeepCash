name: DeepCash opening subset lattice v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_benchmark_fixtures.py'
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'deepcash_core/reference_convergence_analysis.py'
      - 'tools/benchmark_river_raise_reference_convergence.py'
      - 'tools/benchmark_river_opening_subset_lattice.py'
      - 'tools/analyze_river_reference_convergence.py'
      - '.github/workflows/river-opening-subset-lattice-v1.yml'

jobs:
  opening-subset-lattice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - evidence_set: control
            board_set: control
            stack: 100
            range_combos: 4
            p0_phase: '0.00'
            p1_phase: '0.27'
          - evidence_set: control
            board_set: control
            stack: 400
            range_combos: 4
            p0_phase: '0.00'
            p1_phase: '0.27'
          - evidence_set: heldout_v1_seen
            board_set: heldout
            stack: 100
            range_combos: 6
            p0_phase: '0.13'
            p1_phase: '0.61'
          - evidence_set: heldout_v1_seen
            board_set: heldout
            stack: 400
            range_combos: 6
            p0_phase: '0.13'
            p1_phase: '0.61'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Evaluate every proper subset of the four-size opening reference
        run: >-
          PYTHONPATH=.:tools python tools/benchmark_river_opening_subset_lattice.py
          --checkpoints 250,1000,3000
          --range-combos ${{ matrix.range_combos }}
          --pot 100
          --stack ${{ matrix.stack }}
          --board-set ${{ matrix.board_set }}
          --boards all
          --p0-phase ${{ matrix.p0_phase }}
          --p1-phase ${{ matrix.p1_phase }}
          --candidates all
          --out river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
      - name: Analyze lattice convergence without post-hoc thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
          --out river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-opening-subset-lattice-${{ matrix.evidence_set }}-${{ matrix.stack }}
          path: |
            river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
            river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}_analysis.json
