name: DeepCash opening subset lattice v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_benchmark_fixtures.py'
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'deepcash_core/reference_convergence_analysis.py'
      - 'tools/benchmark_river_raise_reference_convergence.py'
      - 'tools/benchmark_river_opening_subset_lattice.py'
      - 'tools/select_opening_lattice_champions.py'
      - 'tools/summarize_opening_heldout_v2.py'
      - 'tools/analyze_river_reference_convergence.py'
      - 'docs/R3_HELDOUT_V2_PRECOMMIT_20260816.md'
      - '.github/workflows/river-opening-subset-lattice-v1.yml'

jobs:
  opening-subset-lattice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - evidence_set: control
            board_set: control
            stack: 100
            range_combos: 4
            p0_phase: '0.00'
            p1_phase: '0.27'
          - evidence_set: control
            board_set: control
            stack: 400
            range_combos: 4
            p0_phase: '0.00'
            p1_phase: '0.27'
          - evidence_set: heldout_v1_seen
            board_set: heldout
            stack: 100
            range_combos: 6
            p0_phase: '0.13'
            p1_phase: '0.61'
          - evidence_set: heldout_v1_seen
            board_set: heldout
            stack: 400
            range_combos: 6
            p0_phase: '0.13'
            p1_phase: '0.61'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Evaluate every proper subset of the four-size opening reference
        run: >-
          PYTHONPATH=.:tools python tools/benchmark_river_opening_subset_lattice.py
          --checkpoints 250,1000,3000
          --range-combos ${{ matrix.range_combos }}
          --pot 100
          --stack ${{ matrix.stack }}
          --board-set ${{ matrix.board_set }}
          --boards all
          --p0-phase ${{ matrix.p0_phase }}
          --p1-phase ${{ matrix.p1_phase }}
          --candidates all
          --out river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
      - name: Analyze lattice convergence without post-hoc thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
          --out river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-opening-subset-lattice-${{ matrix.evidence_set }}-${{ matrix.stack }}
          path: |
            river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}.json
            river_opening_subset_lattice_${{ matrix.evidence_set }}_${{ matrix.stack }}_analysis.json

  select-cardinality-champions:
    needs: opening-subset-lattice
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.export.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download only seen engineering lattice artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: river-opening-subset-lattice-*
          path: lattice_artifacts
          merge-multiple: true
      - name: Apply precommitted champion-selection rule
        run: >-
          python tools/select_opening_lattice_champions.py
          lattice_artifacts
          --out opening_subset_champions.json
      - id: export
        name: Export exactly one champion per cardinality
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data = json.load(open('opening_subset_champions.json', encoding='utf-8'))
          names = ','.join(data['champions'][str(k)]['candidate'] for k in (1, 2, 3))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'candidates={names}\n')
          print(f'forwarded held-out-v2 candidates: {names}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opening-subset-cardinality-champions
          path: opening_subset_champions.json

  heldout-v2:
    needs: select-cardinality-champions
    strategy:
      fail-fast: false
      matrix:
        stack: [100, 200, 400]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Evaluate only preselected champions on unseen held-out v2
        run: >-
          PYTHONPATH=.:tools python tools/benchmark_river_opening_subset_lattice.py
          --checkpoints 300,1200,3600
          --range-combos 8
          --pot 100
          --stack ${{ matrix.stack }}
          --board-set heldout_v2
          --boards all
          --p0-phase 0.31
          --p1-phase 0.79
          --candidates '${{ needs.select-cardinality-champions.outputs.candidates }}'
          --out river_opening_heldout_v2_${{ matrix.stack }}.json
      - name: Analyze unseen-v2 convergence without post-hoc thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_opening_heldout_v2_${{ matrix.stack }}.json
          --out river_opening_heldout_v2_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-opening-heldout-v2-${{ matrix.stack }}
          path: |
            river_opening_heldout_v2_${{ matrix.stack }}.json
            river_opening_heldout_v2_${{ matrix.stack }}_analysis.json

  summarize-heldout-v2:
    needs: heldout-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download unseen held-out-v2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: river-opening-heldout-v2-*
          path: heldout_v2_artifacts
          merge-multiple: true
      - name: Summarize held-out-v2 generalization without selecting production actions
        run: >-
          python tools/summarize_opening_heldout_v2.py
          heldout_v2_artifacts
          --out opening_heldout_v2_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: opening-heldout-v2-summary
          path: opening_heldout_v2_summary.json
