name: DeepCash raise-size held-out v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_raise_size_heldout_fixtures.py'
      - 'deepcash_core/river_benchmark_fixtures.py'
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'deepcash_core/reference_convergence_analysis.py'
      - 'tools/benchmark_river_raise_size_reference_convergence.py'
      - 'tools/benchmark_river_raise_size_heldout.py'
      - 'tools/summarize_raise_size_heldout.py'
      - 'tools/analyze_river_reference_convergence.py'
      - 'docs/R3_RAISE_SIZE_HELDOUT_PRECOMMIT_20260816.md'
      - '.github/workflows/river-raise-size-heldout-v1.yml'

jobs:
  raise-size-heldout:
    strategy:
      fail-fast: false
      matrix:
        stack: [100, 200, 400]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run unseen raise-size held-out battery
        run: >-
          PYTHONPATH=.:tools python tools/benchmark_river_raise_size_heldout.py
          --checkpoints 300,1200,3600
          --range-combos 6
          --pot 100
          --stack ${{ matrix.stack }}
          --boards all
          --candidates Q1_100,Q2_50_100,Q2_100_150,Q3_50_100_150
          --out river_raise_size_heldout_${{ matrix.stack }}.json
      - name: Analyze held-out convergence without post-hoc strategic thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_raise_size_heldout_${{ matrix.stack }}.json
          --out river_raise_size_heldout_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-raise-size-heldout-${{ matrix.stack }}
          path: |
            river_raise_size_heldout_${{ matrix.stack }}.json
            river_raise_size_heldout_${{ matrix.stack }}_analysis.json

  summarize:
    needs: raise-size-heldout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download unseen raise-size held-out artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: river-raise-size-heldout-*
          path: raise_size_heldout_artifacts
          merge-multiple: true
      - name: Summarize unseen raise-size generalization
        run: >-
          python tools/summarize_raise_size_heldout.py
          raise_size_heldout_artifacts
          --out raise_size_heldout_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: raise-size-heldout-summary
          path: raise_size_heldout_summary.json
