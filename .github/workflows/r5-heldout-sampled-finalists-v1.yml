name: DeepCash R5 sampled-finalist held-out v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/run_r5_heldout_sampled_finalists_v1.py'
      - 'tests/test_r5_heldout_sampled_finalists_runner.py'
      - 'docs/R5_HELDOUT_SAMPLED_FINALISTS_PRECOMMIT_20260819.md'
      - '.github/workflows/r5-heldout-sampled-finalists-v1.yml'

permissions:
  contents: write

jobs:
  heldout-finalists:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Gate frozen held-out runner before numerical consumption
        run: >-
          python -m pytest -q
          tests/test_weighted_deal_sampler.py
          tests/test_river_external_sampling.py
          tests/test_river_correlated_chance_sampling.py
          tests/test_river_vr_external_sampling.py
          tests/test_r5_heldout_sampled_finalists_runner.py
      - name: Run frozen R5 sampled-finalist held-out battery
        run: >-
          python tools/run_r5_heldout_sampled_finalists_v1.py
          --out r5_heldout_sampled_finalists_v1.json
      - name: Hash result artifact
        run: sha256sum r5_heldout_sampled_finalists_v1.json > r5_heldout_sampled_finalists_v1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r5-heldout-sampled-finalists-v1
          path: |
            r5_heldout_sampled_finalists_v1.json
            r5_heldout_sampled_finalists_v1.sha256
          if-no-files-found: error
      - name: Publish immutable hosted evidence pointer to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/r5_heldout_sampled_finalists_v1
          cp r5_heldout_sampled_finalists_v1.json evidence/r5_heldout_sampled_finalists_v1/latest.json
          cp r5_heldout_sampled_finalists_v1.sha256 evidence/r5_heldout_sampled_finalists_v1/latest.sha256
          printf 'workflow_run_id=%s\nsource_sha=%s\nworkflow=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_WORKFLOW" \
            > evidence/r5_heldout_sampled_finalists_v1/latest_workflow.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/r5_heldout_sampled_finalists_v1
          git commit -m "Record R5 held-out sampled-finalist evidence run $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
