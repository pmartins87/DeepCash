name: DeepCash river reference DP engineering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_reference_dp.py'
      - 'deepcash_core/river_reference_lab.py'
      - 'deepcash_core/river_reference_training.py'
      - 'tools/benchmark_river_reference_convergence.py'
      - 'tools/benchmark_river_reference_convergence_dp.py'
      - 'tools/analyze_river_reference_convergence.py'
      - 'tests/test_river_reference_dp.py'
      - '.github/workflows/river-reference-dp-engineering.yml'

jobs:
  dynamic-exact-br-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate dynamic exact best response
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_river_reference_dp.py
      - name: Run richer DP-accelerated common-reference convergence
        run: >-
          python tools/benchmark_river_reference_convergence_dp.py
          --checkpoints 250,1000,3000
          --range-combos 4
          --boards A_high_dry,paired
          --candidates S1_50,S2_33_100,S3_25_75_150
          --out river_reference_dp_engineering.json
      - name: Analyze common-reference tightening
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_reference_dp_engineering.json
          --out river_reference_dp_engineering_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-reference-dp-engineering
          path: |
            river_reference_dp_engineering.json
            river_reference_dp_engineering_analysis.json
