name: DeepCash R6 posterior representation remediation dev v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deepcash_core/data/r6_posterior_representation_heldout_v2.json'
      - 'docs/R6_POSTERIOR_REPRESENTATION_HELDOUT_V2_PRECOMMIT_20260819.md'
      - 'tools/run_r6_posterior_representation_remediation_dev_v1.py'
      - 'tests/test_r6_posterior_representation_remediation_dev.py'
      - '.github/workflows/r6-posterior-representation-remediation-dev-v1.yml'
  push:
    branches: [main]
    paths:
      - 'deepcash_core/data/r6_posterior_representation_heldout_v2.json'
      - 'docs/R6_POSTERIOR_REPRESENTATION_HELDOUT_V2_PRECOMMIT_20260819.md'
      - 'tools/run_r6_posterior_representation_remediation_dev_v1.py'
      - 'tests/test_r6_posterior_representation_remediation_dev.py'
      - '.github/workflows/r6-posterior-representation-remediation-dev-v1.yml'

permissions:
  contents: write

jobs:
  remediation-development-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Gate remediation firewall and structure
        run: >-
          python -m pytest -q
          tests/test_turn_river_exact_game.py
          tests/test_r4_production_representation_freeze.py
          tests/test_r6_posterior_representation_remediation_dev.py
      - name: Run consumed-cell development diagnostic on main only
        if: github.event_name != 'pull_request'
        run: >-
          python tools/run_r6_posterior_representation_remediation_dev_v1.py
          --out r6_posterior_representation_remediation_dev_v1.json
      - name: Hash result on main only
        if: github.event_name != 'pull_request'
        run: sha256sum r6_posterior_representation_remediation_dev_v1.json > r6_posterior_representation_remediation_dev_v1.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: r6-posterior-representation-remediation-dev-v1
          path: |
            r6_posterior_representation_remediation_dev_v1.json
            r6_posterior_representation_remediation_dev_v1.sha256
          if-no-files-found: error
      - name: Publish immutable development evidence pointer to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/r6_posterior_representation_remediation_dev_v1
          cp r6_posterior_representation_remediation_dev_v1.json evidence/r6_posterior_representation_remediation_dev_v1/latest.json
          cp r6_posterior_representation_remediation_dev_v1.sha256 evidence/r6_posterior_representation_remediation_dev_v1/latest.sha256
          printf 'workflow_run_id=%s\nsource_sha=%s\nworkflow=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_WORKFLOW" \
            > evidence/r6_posterior_representation_remediation_dev_v1/latest_workflow.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/r6_posterior_representation_remediation_dev_v1
          git commit -m "Record R6 posterior remediation development evidence run $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
