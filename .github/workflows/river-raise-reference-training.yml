name: DeepCash one-raise reference training gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_dp.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'tests/test_river_raise_reference_lab.py'
      - 'tests/test_river_raise_reference_dp.py'
      - 'tests/test_river_raise_reference_training.py'
      - '.github/workflows/river-raise-reference-training.yml'

jobs:
  resumable-one-raise-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate dynamic BR and exact staged resume
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_river_raise_reference_lab.py \
            tests/test_river_raise_reference_dp.py \
            tests/test_river_raise_reference_training.py
