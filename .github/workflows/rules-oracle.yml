name: DeepCash full-game rules oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/betting.py'
      - 'deepcash_core/hand.py'
      - 'deepcash_core/pots.py'
      - 'deepcash_core/seating.py'
      - 'tools/crosscheck_pokerkit_fullgame.py'
      - '.github/workflows/rules-oracle.yml'
  pull_request:
    paths:
      - 'deepcash_core/betting.py'
      - 'deepcash_core/hand.py'
      - 'deepcash_core/pots.py'
      - 'deepcash_core/seating.py'
      - 'tools/crosscheck_pokerkit_fullgame.py'
      - '.github/workflows/rules-oracle.yml'

jobs:
  pokerkit-fullgame-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent NLHE rules engine
        run: >-
          python -m pip install
          'git+https://github.com/uoftcprg/pokerkit.git@5841c0afe4d6eb71ae5db0f8a6a376ee3e329afb'
      - name: Cross-check deterministic full-game traces
        run: PYTHONPATH=. python tools/crosscheck_pokerkit_fullgame.py
