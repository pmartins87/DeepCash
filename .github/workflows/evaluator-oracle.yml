name: DeepCash evaluator oracles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/cards.py'
      - 'deepcash_core/evaluator.py'
      - 'tools/audit_five_card_distribution.py'
      - 'tools/crosscheck_pokerkit.py'
      - '.github/workflows/evaluator-oracle.yml'
  pull_request:
    paths:
      - 'deepcash_core/cards.py'
      - 'deepcash_core/evaluator.py'
      - 'tools/audit_five_card_distribution.py'
      - 'tools/crosscheck_pokerkit.py'
      - '.github/workflows/evaluator-oracle.yml'

jobs:
  exhaustive-and-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent Hold'em oracle
        run: >-
          python -m pip install
          'git+https://github.com/uoftcprg/pokerkit.git@5841c0afe4d6eb71ae5db0f8a6a376ee3e329afb'
      - name: Exhaustive five-card category distribution
        run: PYTHONPATH=. python tools/audit_five_card_distribution.py
      - name: Cross-check evaluator against PokerKit
        run: PYTHONPATH=. python tools/crosscheck_pokerkit.py
