name: DeepCash R5 tabular VR oracle v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_vr_tabular.py'
      - 'tests/test_river_vr_tabular.py'
      - '.github/workflows/r5-vr-tabular-oracle-v1.yml'

jobs:
  tabular-vr-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Gate legal-information running baseline semantics
        run: >-
          python -m pytest -q
          tests/test_vr_mccfr_baseline.py
          tests/test_river_vr_tabular.py
