name: DeepCash R1 sub-BB fullpath diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/diagnose_pokerkit_subbb_sync_fullpath.py'
      - '.github/workflows/r1-subbb-sync-fullpath-diagnostic.yml'

jobs:
  diagnose-fullpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PokerKit
        run: python -m pip install 'git+https://github.com/uoftcprg/pokerkit.git@5841c0afe4d6eb71ae5db0f8a6a376ee3e329afb'
      - name: Replay exact randomized RNG path with enriched sync diagnostics
        run: PYTHONPATH=.:tools python tools/diagnose_pokerkit_subbb_sync_fullpath.py
