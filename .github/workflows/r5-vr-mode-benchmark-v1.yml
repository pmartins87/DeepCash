name: DeepCash R5 VR mode benchmark v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/R5_VR_MODE_BENCHMARK_PLAN_20260816.md'
      - 'tools/benchmark_river_vr_modes.py'
      - '.github/workflows/r5-vr-mode-benchmark-v1.yml'

jobs:
  vr-mode-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run frozen ZERO vs INFOSET_EXACT vs PERFECT_HISTORY battery
        run: >-
          python tools/benchmark_river_vr_modes.py
          --boards all
          --range-combos 8
          --p0-phase 0.13
          --p1-phase 0.61
          --pot 100
          --bet-sizes 25,50,100
          --iterations 2000
          --seeds 101,211,307,401,503
          --modes ZERO,INFOSET_EXACT,PERFECT_HISTORY
          --out r5_vr_modes.json
      - uses: actions/upload-artifact@v4
        with:
          name: r5-vr-mode-benchmark-v1
          path: r5_vr_modes.json
          if-no-files-found: error
