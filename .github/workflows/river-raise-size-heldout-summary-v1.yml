name: DeepCash raise-size held-out summary v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/raise_size_summary.py'
      - 'tools/summarize_raise_size_heldout.py'
      - 'tests/test_raise_size_heldout_summary.py'
      - '.github/workflows/river-raise-size-heldout-summary-v1.yml'

jobs:
  summarize-existing-heldout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Download completed held-out artifacts without rerunning expensive cells
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pmartins87/DeepCash
          run-id: 31962687271
          pattern: river-raise-size-heldout-*
          path: raise_size_heldout_artifacts
          merge-multiple: true
      - name: Build fail-closed cross-SPR summary
        run: >-
          python tools/summarize_raise_size_heldout.py
          raise_size_heldout_artifacts
          --require-sprs 1,2,4
          --out raise_size_heldout_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: raise-size-heldout-summary-v1
          path: raise_size_heldout_summary.json
