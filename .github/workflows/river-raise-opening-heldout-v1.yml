name: DeepCash opening-size held-out river v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_benchmark_fixtures.py'
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'deepcash_core/reference_convergence_analysis.py'
      - 'tools/benchmark_river_raise_reference_convergence.py'
      - 'tools/analyze_river_reference_convergence.py'
      - '.github/workflows/river-raise-opening-heldout-v1.yml'

jobs:
  heldout-opening-size:
    strategy:
      fail-fast: false
      matrix:
        stack: [100, 400]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run precommitted held-out boards and range phases
        run: >-
          python tools/benchmark_river_raise_reference_convergence.py
          --checkpoints 250,1000,3000
          --range-combos 6
          --pot 100
          --stack ${{ matrix.stack }}
          --board-set heldout
          --boards all
          --p0-phase 0.13
          --p1-phase 0.61
          --candidates O1_50,O2_25_75,O3_25_50_100
          --out river_raise_opening_heldout_${{ matrix.stack }}.json
      - name: Analyze held-out convergence without post-hoc thresholds
        run: >-
          python tools/analyze_river_reference_convergence.py
          river_raise_opening_heldout_${{ matrix.stack }}.json
          --out river_raise_opening_heldout_${{ matrix.stack }}_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-raise-opening-heldout-${{ matrix.stack }}
          path: |
            river_raise_opening_heldout_${{ matrix.stack }}.json
            river_raise_opening_heldout_${{ matrix.stack }}_analysis.json
