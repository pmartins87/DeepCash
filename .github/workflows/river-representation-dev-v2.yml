name: DeepCash R4 representation development v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_representation_br.py'
      - 'deepcash_core/river_representation_training.py'
      - 'deepcash_core/river_representation_solver.py'
      - 'tests/test_river_representation_br.py'
      - 'tests/test_river_representation_lab.py'
      - 'docs/R4_BUCKET_BR_METHODOLOGY_CORRECTION_20260816.md'
      - '.github/workflows/river-representation-dev-v2.yml'

# Exact replay of the frozen v1 development coordinates. Only the BR evaluator
# changes: restricted players now receive exact bucket-constrained BRs.
jobs:
  representation-dev-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Gate bucket-constrained BR oracle
        run: >-
          python -m pytest -q
          tests/test_river_representation_br.py
          tests/test_river_representation_lab.py
      - name: Replay phase A / SPR 1
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 100 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_A_spr1.json
      - name: Replay phase A / SPR 2
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 200 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_A_spr2.json
      - name: Replay phase A / SPR 4
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 400 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_A_spr4.json
      - name: Replay phase B / SPR 1
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 100 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_B_spr1.json
      - name: Replay phase B / SPR 2
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 200 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_B_spr2.json
      - name: Replay phase B / SPR 4
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 400 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_v2_B_spr4.json
      - uses: actions/upload-artifact@v4
        with:
          name: r4-representation-dev-v2
          path: r4_dev_v2_*.json
          if-no-files-found: error
