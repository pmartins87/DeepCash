name: DeepCash R5 VR-MCCFR baseline oracle v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/vr_mccfr_baseline.py'
      - 'tests/test_vr_mccfr_baseline.py'
      - 'docs/R5_VR_MCCFR_BASELINE_ORACLE_PRECOMMIT_20260816.md'
      - '.github/workflows/r5-vr-mccfr-baseline-oracle-v1.yml'

jobs:
  vr-baseline-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Prove baseline estimator algebra
        run: python -m pytest -q tests/test_vr_mccfr_baseline.py
