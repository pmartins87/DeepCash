name: DeepCash river lab smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_lab.py'
      - 'tools/benchmark_river_action_abstraction.py'
      - 'tests/test_river_lab.py'
      - '.github/workflows/river-lab.yml'
  pull_request:
    paths:
      - 'deepcash_core/river_lab.py'
      - 'tools/benchmark_river_action_abstraction.py'
      - 'tests/test_river_lab.py'
      - '.github/workflows/river-lab.yml'

jobs:
  exact-river-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: River exact-BR regression tests
        run: pytest -q tests/test_river_lab.py
      - name: Small multi-board action-abstraction battery
        run: >-
          python tools/benchmark_river_action_abstraction.py
          --iterations 120
          --range-combos 6
          --out river_action_abstraction_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-action-abstraction-smoke
          path: river_action_abstraction_smoke.json
