name: DeepCash river lab smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_lab.py'
      - 'deepcash_core/river_training.py'
      - 'deepcash_core/river_raise_lab.py'
      - 'deepcash_core/river_reference_lab.py'
      - 'deepcash_core/river_reference_training.py'
      - 'tools/benchmark_river_action_abstraction.py'
      - 'tools/benchmark_river_action_convergence.py'
      - 'tools/analyze_river_action_convergence.py'
      - 'tools/benchmark_river_reference_restriction.py'
      - 'tools/benchmark_river_reference_convergence.py'
      - 'tests/test_river_lab.py'
      - 'tests/test_river_training.py'
      - 'tests/test_river_raise_lab.py'
      - 'tests/test_river_reference_lab.py'
      - 'tests/test_river_reference_training.py'
      - '.github/workflows/river-lab.yml'
  pull_request:
    paths:
      - 'deepcash_core/river_lab.py'
      - 'deepcash_core/river_training.py'
      - 'deepcash_core/river_raise_lab.py'
      - 'deepcash_core/river_reference_lab.py'
      - 'deepcash_core/river_reference_training.py'
      - 'tools/benchmark_river_action_abstraction.py'
      - 'tools/benchmark_river_action_convergence.py'
      - 'tools/analyze_river_action_convergence.py'
      - 'tools/benchmark_river_reference_restriction.py'
      - 'tools/benchmark_river_reference_convergence.py'
      - 'tests/test_river_lab.py'
      - 'tests/test_river_training.py'
      - 'tests/test_river_raise_lab.py'
      - 'tests/test_river_reference_lab.py'
      - 'tests/test_river_reference_training.py'
      - '.github/workflows/river-lab.yml'

jobs:
  exact-river-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: River exact-BR, resume, one-raise and reference-game tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_river_lab.py \
            tests/test_river_training.py \
            tests/test_river_raise_lab.py \
            tests/test_river_reference_lab.py \
            tests/test_river_reference_training.py
      - name: Small multi-board action-abstraction battery
        run: >-
          python tools/benchmark_river_action_abstraction.py
          --iterations 120
          --range-combos 6
          --out river_action_abstraction_smoke.json
      - name: Cumulative convergence smoke
        run: >-
          python tools/benchmark_river_action_convergence.py
          --checkpoints 20,60,120
          --range-combos 4
          --out river_action_convergence_smoke.json
      - name: Analyze convergence smoke
        run: >-
          python tools/analyze_river_action_convergence.py
          river_action_convergence_smoke.json
          --out river_action_convergence_analysis_smoke.json
      - name: Common-reference restriction smoke
        run: >-
          python tools/benchmark_river_reference_restriction.py
          --iterations 80
          --range-combos 3
          --boards A_high_dry
          --candidates S1_50
          --out river_reference_restriction_smoke.json
      - name: Resumable common-reference convergence smoke
        run: >-
          python tools/benchmark_river_reference_convergence.py
          --checkpoints 20,80,200
          --range-combos 3
          --boards A_high_dry
          --candidates S1_50
          --out river_reference_convergence_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-action-abstraction-smoke
          path: |
            river_action_abstraction_smoke.json
            river_action_convergence_smoke.json
            river_action_convergence_analysis_smoke.json
            river_reference_restriction_smoke.json
            river_reference_convergence_smoke.json
