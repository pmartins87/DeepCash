name: DeepCash R4 representation development v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_representation_lab.py'
      - 'deepcash_core/river_representation_training.py'
      - 'deepcash_core/river_representation_fixtures.py'
      - 'tools/benchmark_river_representation_reference.py'
      - 'docs/R4_DEV_SELECTION_PRECOMMIT_20260816.md'
      - '.github/workflows/river-representation-dev-v1.yml'

# Development evidence only. Keep this as one sequential job so it cannot fan
# out and starve the still-running R3 evidence workflows. The R4 held-out board
# set is intentionally impossible to select here: every command passes
# --board-set dev explicitly.
jobs:
  representation-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run R4 development controls at phase A / SPR 1
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 100 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_A_spr1.json
      - name: Run R4 development controls at phase A / SPR 2
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 200 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_A_spr2.json
      - name: Run R4 development controls at phase A / SPR 4
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.00 --p1-phase 0.27
          --pot 100 --stack 400 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_A_spr4.json
      - name: Run R4 development controls at phase B / SPR 1
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 100 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_B_spr1.json
      - name: Run R4 development controls at phase B / SPR 2
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 200 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_B_spr2.json
      - name: Run R4 development controls at phase B / SPR 4
        run: >-
          python tools/benchmark_river_representation_reference.py
          --board-set dev --boards all --candidates all
          --range-combos 6 --p0-phase 0.11 --p1-phase 0.54
          --pot 100 --stack 400 --min-bet 20
          --checkpoints 100,400,1200
          --out r4_dev_B_spr4.json
      - uses: actions/upload-artifact@v4
        with:
          name: r4-representation-dev-v1
          path: r4_dev_*.json
