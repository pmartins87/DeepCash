name: DeepCash R1 adversarial engine gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/betting.py'
      - 'deepcash_core/hand.py'
      - 'deepcash_core/pots.py'
      - 'tests/test_r1_adversarial.py'
      - '.github/workflows/r1-adversarial.yml'

jobs:
  adversarial-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and run adversarial exact-engine fixtures
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_r1_adversarial.py
