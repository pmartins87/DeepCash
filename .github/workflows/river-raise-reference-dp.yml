name: DeepCash one-raise reference DP gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_dp.py'
      - 'tests/test_river_raise_reference_lab.py'
      - 'tests/test_river_raise_reference_dp.py'
      - '.github/workflows/river-raise-reference-dp.yml'

jobs:
  dynamic-exact-br-one-raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate one-raise dynamic exact best response
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_river_raise_reference_lab.py \
            tests/test_river_raise_reference_dp.py
