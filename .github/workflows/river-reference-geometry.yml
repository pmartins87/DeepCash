name: DeepCash river reference geometry smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_reference_dp.py'
      - 'tools/benchmark_river_reference_geometry_dp.py'
      - 'tools/analyze_river_reference_geometry.py'
      - '.github/workflows/river-reference-geometry.yml'

jobs:
  multi-spr-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Multi-SPR common-reference smoke
        run: >-
          python tools/benchmark_river_reference_geometry_dp.py
          --iterations 600
          --range-combos 3
          --boards A_high_dry
          --candidates S1_50,S2_33_100
          --geometries SPR0_5,SPR1,SPR2,SPR4
          --out river_reference_geometry_smoke.json
      - name: Analyze geometry smoke
        run: >-
          python tools/analyze_river_reference_geometry.py
          river_reference_geometry_smoke.json
          --out river_reference_geometry_analysis_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-reference-geometry-smoke
          path: |
            river_reference_geometry_smoke.json
            river_reference_geometry_analysis_smoke.json
