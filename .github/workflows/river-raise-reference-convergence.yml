name: DeepCash one-raise reference convergence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deepcash_core/river_raise_reference_lab.py'
      - 'deepcash_core/river_raise_reference_dp.py'
      - 'deepcash_core/river_raise_reference_training.py'
      - 'tools/benchmark_river_raise_reference_convergence.py'
      - '.github/workflows/river-raise-reference-convergence.yml'

jobs:
  common-reference-one-raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DeepCash
        run: python -m pip install -e '.[dev]'
      - name: Run one-raise common-reference convergence smoke
        run: >-
          python tools/benchmark_river_raise_reference_convergence.py
          --checkpoints 100,400,1000
          --range-combos 3
          --boards A_high_dry
          --candidates O1_50,O2_25_75,O3_25_50_100
          --out river_raise_reference_convergence_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-raise-reference-convergence-smoke
          path: river_raise_reference_convergence_smoke.json
